[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abverse"
version = "0.1.0"
description = "Germline-informed reverse translation of antibody amino acid sequences to nucleotide sequences"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Benjamin Nemoz", email = "bnemoz@scripps.edu" }]
keywords = ["antibody", "germline", "reverse-translation", "BCR", "immunology"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "abutils>=0.5.1",
    "polars>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["abverse*"]

[tool.setuptools.package-data]
abverse = ["py.typed"]
